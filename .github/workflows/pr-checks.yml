name: PR Checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv & Python 3.14
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run Ruff Linter
        if: ${{ hashFiles('context/scripts/validators/**/*.py') != '' }}
        run: uv run --with ruff ruff check context/scripts/validators/

      - name: Run Automated Test Suite
        run: uv run pytest -v

      - name: Check Adapter Drift
        run: uv run python context/scripts/validators/adapter_drift.py

      - name: Validate Agent Definitions
        run: uv run python context/scripts/validators/agent_definitions.py

      - name: Verify Typst Formatting Rules
        run: uv run python context/scripts/validators/verify_typst_formatting.py typst/

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Run TypeScript Tests
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          corepack enable
          yarn install --immutable
          yarn test --if-present
