name: PR App Checks

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "context/**"
      - "typst/**"
      - ".github/workflows/pr-subrepo-checks.yml"
  push:
    branches: [main, master]
    paths-ignore:
      - "context/**"
      - "typst/**"
      - ".github/workflows/pr-subrepo-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  app-checks:
    name: Application Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Placeholder Application Check
        run: |
          echo "Placeholder for application-specific checks (services, APIs, frontends)."
          echo "Add application test suites, builds, or linting here."

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Run TypeScript Tests
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          corepack enable
          yarn install --immutable
          yarn test --if-present
