# Domains Registry
# Used by meta-orchestrator for routing decisions
# Keep minimal: ~50 tokens per domain

version: 1.0

domains:
  # Example: Authentication Service
  auth-service:
    orchestrator: auth-orchestrator
    capabilities:
      - authentication
      - authorisation
      - tokens
      - sessions
      - SSO
      - OAuth
    paths:
      - src/auth/**
      - services/auth/**

  # Example: Data Service
  data-service:
    orchestrator: data-orchestrator
    capabilities:
      - persistence
      - database
      - caching
      - queries
      - migrations
      - ORM
    paths:
      - src/data/**
      - services/data/**
      - prisma/**

  # Example: API Gateway
  api-gateway:
    orchestrator: api-orchestrator
    capabilities:
      - routing
      - rate-limiting
      - validation
      - middleware
      - REST
      - GraphQL
    paths:
      - src/api/**
      - services/gateway/**

# Cross-cutting concerns
# These don't have dedicated domains; meta-orchestrator handles decomposition
cross-cutting:
  - logging        # Touches all domains
  - monitoring     # Touches all domains
  - CI/CD          # Infrastructure, not domain-specific
  - documentation  # May span domains

# Routing hints for ambiguous cases
fallback_rules:
  - pattern: "*.test.ts"
    domain: same-as-source    # Route to domain that owns the source file
  - pattern: "docs/**"
    domain: nearest-match     # Match based on doc path
  - pattern: "scripts/**"
    domain: meta-orchestrator # Handle at top level
