# Import boundary configuration for this project.
#
# Each boundary declares an import pattern that must ONLY appear in the listed
# directories. Files outside those directories that match the pattern will fail
# the pre-commit hook.
#
# Add entries here when your architecture requires a library to be isolated to
# one service (e.g. database clients, payment SDKs, internal platform APIs).
#
# The hook is registered in .pre-commit-config.yaml as:
#   - id: import-boundaries
#     files: \.py$
#
# See context/scripts/validators/import_boundaries.py for the implementation.

boundaries: []

