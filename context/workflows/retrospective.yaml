name: retrospective
description: Workflow efficiency analysis — run after deployment or on demand for mid-cycle health checks

phases:
  - id: retrospective
    name: Workflow Efficiency Analysis
    optional: true
    agents:
      - workflow-analyst  # Analyse handoffs, git history, token usage; produce efficiency report
    outputs:
      - artefacts/build/efficiency-report.md
      - artefacts/build/efficiency-data/
    validation:
      - All data sources analysed (tasks, handoffs, git, conversation)
      - Metrics calculated for all phases
      - Top 3-5 bottlenecks identified
      - Actionable recommendations provided
      - Workflow health score calculated
    notes:
      - Requires git history access for commit analysis
      - Compare metrics to previous cycles for trend analysis

workflow_rules:
  - No code changes in this workflow — analysis and reporting only
  - Use Write/Edit tools for file operations (not bash with echo/cat/sed)
  - Estimate effort in tokens, not time

# ---
# Notes (human reference)
#
# Run standalone after deployment for post-mortem analysis.
# Can skip for urgent deployments (phase is optional).
# Can also run mid-cycle on demand to identify bottlenecks before they compound.
