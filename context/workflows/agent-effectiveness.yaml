# Agent Effectiveness Workflow Addon
#
# Add this phase to any workflow for agent and workflow efficiency analysis
# Can be added to default.yaml or run as standalone effectiveness review

phases:
  - id: retrospective
    name: Workflow Efficiency Analysis
    depends_on: [deployment-review]  # Or run independently on-demand
    optional: true  # Can be skipped for urgent deployments
    agents:
      - workflow-analyst
    outputs:
      - artefacts/build/efficiency-report.md
      - artefacts/build/efficiency-data/
    validation:
      - All data sources analyzed (tasks, handoffs, git, conversation)
      - Metrics calculated for all phases
      - Top 3-5 bottlenecks identified
      - Actionable recommendations provided
      - Workflow health score calculated
    notes:
      - Run after deployment for post-mortem analysis
      - Run on-demand for mid-cycle health checks
      - Requires git history access for commit analysis
      - Compare metrics to previous cycles for trend analysis

# Example: Add to end of default.yaml
#
#   - id: deployment-review
#     ... existing phase ...
