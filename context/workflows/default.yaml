# Default Workflow: Full TDD with Reviews
#
# Complete workflow with all quality gates, reviews, and testing phases.
# Use for production features and critical functionality.
#
# PARALLELISM EXPLAINED:
#
# 1. Phase-level parallelism (inter-phase):
#    - Phases WITHOUT dependencies between them can run simultaneously
#    - Example: If phase A and B both depend on phase C, then A and B can run in parallel
#    - Controlled by: depends_on field (implicit - no dependency = can be parallel)
#
# 2. Agent-level parallelism (intra-phase):
#    - Agents WITHIN a phase can run simultaneously
#    - Example: python-coder and typescript-coder in tdd-green
#    - Controlled by: parallel: true (explicit flag)
#    - If sequential: true, agents run one after another
#
# Current workflow is LINEAR: discovery → design → design-review → tdd-red →
# tdd-green → tdd-blue → unit-test → integration-test → e2e-test →
# quality-review → docs-cleanup → deployment → deployment-review
#
# No phase-level parallelism in this workflow (strict sequence enforced).
# Three quality gates: design-review, quality-review, deployment-review

name: default
description: Full TDD workflow with comprehensive reviews and testing

phases:
  - id: discovery
    name: Requirements & Planning
    sequential: true
    agents:
      - product-expert   # First: clarify vague ideas
      - product-owner    # Then: formalise into requirements
    outputs:
      - artefacts/product/

  - id: design
    name: Architecture & Design
    depends_on: [discovery]
    parallel: true
    agents:
      - solution-architect
      - database-designer
      - api-designer
      - ui-designer
      - visual-designer  # Creates visual designs and mockups
    outputs:
      - artefacts/architecture/
      - artefacts/api/
      - artefacts/design/

  - id: design-review
    name: Design Review Gate
    depends_on: [design]
    sequential: true
    gate: true
    agents:
      - tech-lead             # First: architecture soundness
      - code-reviewer         # Second: implementation feasibility
      - principles-reviewer   # Third: LESS principles in design
      - visual-designer       # Fourth: design consistency and standards
      - security-tester       # Fifth: security architecture review
    outputs:
      - artefacts/build/
    validation:
      - tech-lead must APPROVE before next reviewer
      - CHANGES REQUIRED → return to design phase
      - No architectural security issues
      - Design meets LESS principles
      - Visual design standards met

  - id: tdd-red
    name: "TDD Red: Write Failing Tests"
    depends_on: [design-review]
    agents:
      - functional-tester
    outputs:
      - tests/
    validation:
      - All tests must fail initially
      - Coverage targets defined
    notes:
      - Use Write/Edit tools for creating test files, not bash
      - "Python tests: use uv for running pytest"
      - "TypeScript tests: use yarn for running tests"

  - id: tdd-green
    name: "TDD Green: Implement to Pass Tests"
    depends_on: [tdd-red]
    parallel: true
    agents:
      - python-coder
      - typescript-coder
    outputs:
      - Source code
      - Tests passing
    validation:
      - All tests must pass
      - No test modifications allowed
    notes:
      - "Python: use uv for all package management and script execution"
      - "TypeScript: use yarn for all package management, yarn dlx for one-off tools"
      - Use Write/Edit tools for code files, not bash with echo/cat/heredoc

  - id: tdd-blue
    name: "TDD Blue: Refactor"
    depends_on: [tdd-green]
    parallel: true
    agents:
      - python-coder
      - typescript-coder
    outputs:
      - Refactored code
      - Tests still passing
    validation:
      - All tests must still pass
      - Code quality improved (reduced duplication, better naming, clearer structure)
      - No new functionality added
    notes:
      - Focus on improving code structure without changing behaviour
      - Remove duplication, improve naming, simplify logic
      - Maintain 100% test pass rate throughout refactoring

  - id: unit-test
    name: Unit Testing
    depends_on: [tdd-blue]
    parallel: true
    agents:
      - functional-tester
    outputs:
      - artefacts/test-results/unit/
    validation:
      - Coverage >= 90%
      - All edge cases tested

  - id: integration-test
    name: Integration Testing
    depends_on: [unit-test]
    parallel: true
    agents:
      - functional-tester
    outputs:
      - artefacts/test-results/integration/
    validation:
      - API contracts verified
      - Service interactions tested
      - Database migrations validated

  - id: e2e-test
    name: "UI E2E Testing"
    depends_on: [integration-test]
    agents:
      - ui-tester
    outputs:
      - artefacts/test-results/e2e/
      - artefacts/test-results/e2e/screenshots/
    validation:
      - At least one screenshot per user workflow
      - Browser interactions documented (not just API calls)
      - Complete user workflows tested
      - Visual regression tests pass (threshold configurable)
    notes:
      - "REQUIRED: Screenshots in artefacts/test-results/e2e/screenshots/"
      - Test log must show browser interactions, not just API calls
      - Must test actual UI, not just backend APIs
      - "RECOMMENDED: Automated visual diff checking (see tech-standards.md for Puppeteer + pixelmatch)"

  - id: quality-review
    name: Quality Review Gate
    depends_on: [e2e-test]
    sequential: true
    gate: true
    agents:
      - tech-lead             # First: architecture compliance
      - code-reviewer         # Second: code quality
      - principles-reviewer   # Third: LESS principles
      - visual-designer       # Fourth: UI implementation matches design specs
      - security-tester       # Fifth: security audit
    outputs:
      - artefacts/build/
    validation:
      - tech-lead must APPROVE before next reviewer
      - CHANGES REQUIRED → return to appropriate phase
      - No critical security issues
      - UI meets design standards

  - id: docs-cleanup
    name: Documentation Cleanup
    depends_on: [quality-review]
    agents:
      - documentation
    outputs:
      - README.md updates
      - artefacts/ cleanup
      - API documentation
    validation:
      - Old documentation archived (not deleted)
      - All documentation follows doc-standards.md
      - README.md updated with current information
      - API documentation complete and accurate
      - build/tasks.md reflects current status
      - HANDOFF.md includes final handoff entry
    notes:
      - Archive superseded artefacts (do not delete)
      - Update build/tasks.md status
      - Update HANDOFF.md with final status

  - id: deployment
    name: Infrastructure & Deployment
    depends_on: [docs-cleanup]
    agents:
      - gcp-devops
    outputs:
      - Infrastructure code
      - Deployment configs
    validation:
      - Deployment tested in staging
      - Rollback plan documented

  - id: deployment-review
    name: Deployment Review
    depends_on: [deployment]
    gate: true
    agents:
      - tech-lead
    outputs:
      - artefacts/build/
    validation:
      - Deployment successful
      - Monitoring configured
      - Rollback tested

quality_gates:
  - phase: design-review
    type: approval
    required: true
    description: "Design must be approved before implementation begins: tech-lead → code-reviewer → principles-reviewer → visual-designer → security-tester"
    criteria:
      - metric: architecture_blockers
        threshold: 0
        operator: "=="
      - metric: design_security_issues
        threshold: 0
        operator: "=="

  - phase: quality-review
    type: approval
    required: true
    description: "Implementation must be approved before deployment: tech-lead → code-reviewer → principles-reviewer → visual-designer → security-tester"
    criteria:
      - metric: test_coverage
        threshold: 90
        operator: ">="
      - metric: critical_security_issues
        threshold: 0
        operator: "=="
      - metric: ui_screenshots
        threshold: 1
        operator: ">="
      - metric: visual_regression_pass
        threshold: true
        operator: "=="

  - phase: deployment-review
    type: approval
    required: true
    description: "Tech lead must approve deployment before production"

workflow_rules:
  - Tests written before implementation (TDD Red → Green → Blue)
  - Sequential review (tech-lead → code-reviewer → principles-reviewer → visual-designer → security-tester)
  - No test modifications during tdd-green or tdd-blue phases
  - All quality gates must pass
  - Use Write/Edit tools for file operations (not bash with echo/cat/sed)
  - Python agents must use `uv` for all package management
  - TypeScript agents must use `yarn` for all package management, `yarn dlx` for one-off tools
  - UI tests must include screenshots and browser interactions
  - Update build/tasks.md and HANDOFF.md after completing work
  - Estimate effort in tokens, not time
  - After context compaction, read state recovery section and update status

state_recovery:
  after_compaction:
    - Read artefacts/build/tasks.md for current task status
    - Read HANDOFF.md in current service directory for latest handoff
    - Read artefacts/shared/handoffs/integration-status.md for inter-service status
    - Check git log for recent commits since last conversation
    - Verify current phase by checking which tasks are complete
  critical_files:
    - artefacts/build/tasks.md
    - "{service}/HANDOFF.md"
    - artefacts/shared/handoffs/integration-status.md
    - artefacts/architecture/architecture.md
    - artefacts/product/requirements.md

estimation_guidance:
  - Estimate effort in tokens, not time
  - "Token ranges: Small (10-30k), Medium (30-80k), Large (80-150k), XLarge (150k+)"
  - Time estimates are unreliable and should not be provided
  - Consider context duplication when estimating parallel work
  - Factor in coordination overhead for multi-agent tasks

parallel_planning:
  - Always present parallel execution options when spawning multiple agents
  - Show token trade-offs between sequential and parallel approaches
  - Let user choose based on priorities (speed vs cost vs quality)
  - Identify dependencies before suggesting parallelisation
  - Define clear boundaries and contracts for parallel work
