name: small-task
description: Small tasks, humans collaborating with agents, no automation

# Minimal workflow for fast HITL changes.
# Skips reviews, extensive testing, and infrastructure.
# Use for housekeeping, harness changes.
# May be used as the default workflow if no others are specified.

phases:
  - id: hitl
    name: Human In The Loop
    agents: 
      - Default (general purpose) agent
    scope: all
    gate: true
    notes:
      - Do not use with any other workflows
      - Do not delegate to sub-agents; instead use skills with the default agent
      - All context artefacts except workflows are available
      - No inputs or outputs are specified; these must be included in the prompt or task context
      - Quality principles e.g. LESS, TDD may be ignored - but human must approve work before committing
      
      