[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Agentic Orchestration Harness runtime adapter generator and drift validator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "WithinEve", email = "noreply@withineve.com" }
]
keywords = ["agents", "orchestration", "gemini", "claude", "copilot", "codex", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agent-harness = "context.scripts.generators.generate_adapters:main"
agent-drift = "context.scripts.validators.adapter_drift:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["context/scripts/tests"]

[tool.hatch.build.targets.wheel]
packages = ["context"]

[tool.hatch.build.targets.sdist]
include = [
    "/context",
    "/README.md",
    "/pyproject.toml",
]
