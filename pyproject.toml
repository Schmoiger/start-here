[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Agentic Orchestration Harness runtime adapter generator and drift validator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "WithinEve", email = "noreply@withineve.com" }
]
keywords = ["agents", "orchestration", "gemini", "claude", "copilot", "codex", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "anyio>=4.14.2",
    "virtualenv>=21.7.13",
    "pytest>=9.0.3",
    "filelock>=3.20.3",
]

[project.scripts]
agent-harness = "context.scripts.generators.generate_adapters:main"
agent-drift = "context.scripts.validators.adapter_drift:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["context/scripts/tests"]

[tool.hatch.build.targets.wheel]
packages = ["context"]

[tool.hatch.build.targets.sdist]
include = [
    "/context",
    "/README.md",
    "/pyproject.toml",
]
