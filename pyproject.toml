[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Agentic Orchestration Harness runtime adapter generator and drift validator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Info", email = "info@mindrocketnow.com" }
]
keywords = ["agents", "orchestration", "gemini", "claude", "copilot", "codex", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
agent-harness = "context.scripts.generators.generate_adapters:main"
agent-drift = "context.scripts.validators.adapter_drift:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["context/scripts/tests"]

# ── System (non-Python) dependencies ──────────────────────────────────────────
# External binaries the test suite and the spec indexer rely on. This table is the
# single source of truth: `context/scripts/setup/install_system_deps.py` probes each
# entry and installs only the missing ones. `.github/workflows/pr-subrepo-checks.yml`
# runs that script before the test suite, so a bare runner image bootstraps itself
# from the manifest instead of failing a test with FileNotFoundError.
#
#   probe   — command used to detect the binary (exit code 0 == available)
#   install — shell command per platform.system().lower() key; `default` is a fallback

[tool.agent-harness.system-dependencies.ctags]
probe = ["ctags", "--version"]
install = { linux = "sudo apt-get update -qq && sudo apt-get install -y universal-ctags", darwin = "brew install universal-ctags" }

[tool.agent-harness.system-dependencies.ast-grep]
probe = ["ast-grep", "--version"]
install = { linux = "sudo npm install --global @ast-grep/cli", darwin = "brew install ast-grep" }

[tool.hatch.build.targets.wheel]
packages = ["context"]

[tool.hatch.build.targets.sdist]
include = [
    "/context",
    "/README.md",
    "/pyproject.toml",
]
