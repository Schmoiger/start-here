[project]
name = "docs-unit-tests"
version = "0.1.0"
description = "Unit tests for documentation validation"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
